xt fill="#212121" style="font-family: Arial, sans-serif; font-size: 12px; font-weight: normal" text-anchor="middle" x="187" y="185">Paziente con ittero e febbre a 40°C</text><text fill="#9E9E9E" style="font-family: Arial, sans-serif; font-size: 11px; font-weight: normal" text-anchor="middle" x="187" y="200">arriva in Pronto Soccorso</text></g><g id="question"><rect fill="#FAFAFA" height="80" rx="8" ry="8" stroke="#BDBDBD" stroke-width="1" width="335" x="20" y="225" /><text fill="#212121" style="font-family: Arial, sans-serif; font-size: 14px; font-weight: bold" text-anchor="middle" x="187" y="255">Quale primo intervento</text><text fill="#212121" style="font-family: Arial, sans-serif; font-size: 14px; font-weight: bold" text-anchor="middle" x="187" y="280">decidi di eseguire?</text></g><circle cx="55" cy="365" fill="none" r="14" stroke="#1976D2" stroke-width="2" /><g id="option_0"><rect fill="#FAFAFA" height="80" rx="8" ry="8" stroke="#BDBDBD" stroke-width="1" width="335" x="20" y="325" /><circle cx="55" cy="365" fill="#FFFFFF" r="14" /><text fill="#212121" style="font-family: Arial, sans-serif; font-size: 12px; font-weight: bold" text-anchor="start" x="80" y="360">A) Ecografia addominale</text><rect fill="#4CAF50" height="20" rx="10" ry="10" width="120" x="80" y="375" /><text fill="#FFFFFF" style="font-family: Arial, sans-serif; font-size: 9px; font-weight: normal" text-anchor="middle" x="140" y="389">Scelta ottimale</text></g><circle cx="55" cy="460" fill="none" r="14" stroke="#1976D2" stroke-width="2" /><g id="option_1"><rect fill="#FAFAFA" height="80" rx="8" ry="8" stroke="#BDBDBD" stroke-width="1" width="335" x="20" y="420" /><circle cx="55" cy="460" fill="#FFFFFF" r="14" /><text fill="#212121" style="font-family: Arial, sans-serif; font-size: 12px; font-weight: bold" text-anchor="start" x="80" y="455">B) Antipiretico + Temperatura</text><rect fill="#FF9800" height="20" rx="10" ry="10" width="120" x="80" y="470" /><text fill="#FFFFFF" style="font-family: Arial, sans-serif; font-size: 9px; font-weight: normal" text-anchor="middle" x="140" y="484">Scelta accettabile</text></g><circle cx="55" cy="555" fill="none" r="14" stroke="#1976D2" stroke-width="2" /><g id="option_2"><rect fill="#FAFAFA" height="80" rx="8" ry="8" stroke="#BDBDBD" stroke-width="1" width="335" x="20" y="515" /><circle cx="55" cy="555" fill="#FFFFFF" r="14" /><text fill="#212121" style="font-family: Arial, sans-serif; font-size: 12px; font-weight: bold" text-anchor="start" x="80" y="550">C) Osservazione 24 ore</text><rect fill="#F44336" height="20" rx="10" ry="10" width="120" x="80" y="565" /><text fill="#FFFFFF" style="font-family: Arial, sans-serif; font-size: 9px; font-weight: normal" text-anchor="middle" x="140" y="579">Attenzione!</text></g><text fill="#9E9E9E" style="font-family: Arial, sans-serif; font-size: 10px; font-weight: normal" text-anchor="middle" x="187" y="625">Non esistono risposte "sbagliate"</text><text fill="#9E9E9E" style="font-family: Arial, sans-serif; font-size: 9px; font-weight: normal" text-anchor="middle" x="187" y="642">ma alcune scelte sono più appropriate di altre</text><g id="warning"><rect fill="#FFF3E0" height="40" rx="6" ry="6" stroke="#FF9800" stroke-width="1" width="295" x="40" y="660" /><text fill="#FF9800" style="font-family: Arial, sans-serif; font-size: 10px; font-weight: bold" text-anchor="middle" x="187" y="685">Ogni scelta influenza lo stato del paziente</text></g><g id="button_CONFERMA_SCELTA"><rect fill="#1976D2" height="50" rx="6" ry="6" width="295" x="40" y="715" /><text fill="#FFFFFF" style="font-family: Arial, sans-serif; font-size: 12px; font-weight: bold" text-anchor="middle" x="187.5" y="745.0">CONFERMA SCELTA</text></g><text fill="#212121" style="font-family: Arial, sans-serif; font-size: 10px; font-weight: bold" text-anchor="middle" x="187" y="795">WIREFRAME: SCENARIO MOBILE SCELTA</text></g></svg>